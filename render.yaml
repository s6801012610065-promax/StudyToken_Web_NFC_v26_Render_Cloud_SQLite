services:
  - type: web
    name: studytoken-web
    runtime: python
    plan: free
    region: singapore
    rootDir: v26
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn --workers 1 --threads 4 --timeout 120 app:app
    healthCheckPath: /health
    envVars:
      - key: STUDYTOKEN_CLOUD_MODE
        value: "1"
      - key: STUDYTOKEN_DB
        value: /tmp/study_token.db
